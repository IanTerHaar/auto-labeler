name: AutoLabeler
description: Apply labels to a pull request based on checked checkboxes in the PR body.
author: IanTerHaar
branding:
  icon: tag
  color: blue

inputs:
  labels:
    description: Comma-separated list of known labels to manage (e.g. "bug, chore, feature").
    required: true
  token:
    description: GitHub token used to read and update PR labels.
    required: false
    default: ${{ github.token }}
  fail_on_no_label:
    description: If true, fail the workflow when no label is selected in the PR template (checkboxes).
    required: false
    default: false
  ready_to_merge_label:
    description: >-
      Label to apply when the PR meets all configured conditions. Set to an
      empty string to disable the ready-to-merge feature.
    required: false
    default: Ready to Merge
  ready_to_merge_conditions:
    description: >-
      Comma-separated list of conditions required to apply the ready-to-merge
      label. Supported values: not_draft, mergeable, checks_passing, approved,
      at_least_one_label. Defaults to all conditions.
    required: false
    default: not_draft, mergeable, checks_passing, approved, at_least_one_label

runs:
  using: composite
  steps:
    - name: Apply labels from PR checkboxes
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const path = require('path');
          const applyLabels = require(path.join(process.env.GITHUB_ACTION_PATH, 'scripts', 'apply-labels.js'));
          await applyLabels({
            github,
            context,
            core,
            labelsInput: `${{ inputs.labels }}`,
            fail_on_no_label: `${{ inputs.fail_on_no_label }}`,
            ready_to_merge_label: `${{ inputs.ready_to_merge_label }}`,
            ready_to_merge_conditions: `${{ inputs.ready_to_merge_conditions }}`,
          });
